name: Native installers for manual testing
on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: windows-x64
          - os: macos-15-intel
            label: macos-x64
          - os: macos-15
            label: macos-arm64
          - os: ubuntu-22.04
            label: linux-x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev portaudio19-dev
      - run: uv sync --extra dev --python 3.12 --frozen
      - run: npm ci
      - run: uv run --extra dev python scripts/verify.py
      - name: Native core and installer
        run: uv run --extra dev python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: lector-local-${{ matrix.label }}-unsigned
          path: artifacts/releases/*
          if-no-files-found: error
          retention-days: 30
