name: Native installers and store packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: windows-x64
          - os: macos-15-intel
            label: macos-x64
          - os: macos-26
            label: macos-arm64
          - os: ubuntu-22.04
            label: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev portaudio19-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: uv sync --extra dev --python 3.12 --frozen
      - run: npm ci
      - name: Build, verify, and package unsigned
        run: uv run --extra dev python scripts/release.py
      - name: Rebuild AMO source and compare
        if: runner.os == 'Linux'
        run: uv run --extra dev python scripts/check_firefox_source.py
      - uses: actions/upload-artifact@v4
        with:
          name: lector-local-${{ matrix.label }}-SIGNING_REQUIRED
          path: release/
          if-no-files-found: error
          retention-days: 30
  publish:
    if: always() && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: collected
      - name: Publish installers by platform
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/publish_ci_release.py collected "$RELEASE_TAG"
