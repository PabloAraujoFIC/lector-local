[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lector-local"
version = "0.1.0"
description = "Lector de documentos y páginas web con voz completamente local"
requires-python = ">=3.11,<3.15"
license = "MIT"
dependencies = ["numpy>=2,<3", "sounddevice>=0.5,<1", "soundfile>=0.13,<1", "kokoro-onnx>=0.4.9,<0.5", "piper-tts>=1.3,<2", "pymupdf>=1.25,<2", "striprtf>=0.0.29,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12", "mypy>=1.15", "pyinstaller>=6"]
browser-test = ["marionette-driver==3.7.1"]

[project.scripts]
lector-core = "reader_core.cli:main"

[tool.setuptools.packages.find]
where = ["core"]

[tool.pytest.ini_options]
pythonpath = ["core"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
files = ["core"]
check_untyped_defs = true
ignore_missing_imports = true
